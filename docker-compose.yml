services:
  postgres:
    image: postgres:16-alpine
    container_name: durak-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-durak_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-durak_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: durak-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-durak_db}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-super-secret-durak-jwt-key-2026}
      JWT_EXPIRATION_HOURS: "24"
      RESET_BASE_URL: "http://localhost:8080/api/v1/auth/reset-password"
      RESET_TOKEN_TTL_MINUTES: "30"

volumes:
  pgdata:
